# The FreeRADIUS clients for tests/radius_test.sh: any address (the container
# sees the Docker gateway), and every request must carry Message-Authenticator.

client signet {
	ipaddr = 0.0.0.0/0
	secret = testing123
	require_message_authenticator = yes
	limit_proxy_state = yes
}
