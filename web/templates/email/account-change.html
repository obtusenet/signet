<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>A change to your account</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
  <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <h1 style="color: #1a1a2e;">A change to your account</h1>

    <p>Hello {{.Email}},</p>

    <p>{{.Change}}</p>

    <p>If this was you, there is nothing more to do. If it was not, contact your administrator now.</p>

    <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">

    <p style="color: #666; font-size: 12px;">
      This email was sent by <strong>{{.AppName}}</strong>.
    </p>
  </div>
</body>
</html>
