# nginx in front of signet and one protected application — FastCGI variant.
#
# signet variant: protocol: "fastcgi", listen: "/var/www/run/signet/fcgi.sock"
# — signet is the FastCGI responder; nginx connects as the client.  The socket must
# be writable by the user nginx runs as: signet's socket_mode (default
# 0660) must match, or use a shared group.
#
# OpenBSD's nginx runs chrooted to /var/www, so fastcgi_pass below names the
# path inside the chroot: /run/signet/fcgi.sock is really
# /var/www/run/signet/fcgi.sock.  Without the chroot (nginx -u, or most other
# systems), write the real path in fastcgi_pass instead.
#
# Why FastCGI: no TCP port for signet at all, and REMOTE_ADDR arrives as
# a protocol parameter — signet knows the real client for its rate
# limiter without trusting any header.

server {
    listen 80;
    server_name app.example.com;

    # --- signet's own URIs, mounted on this origin. ---------------------
    # SCRIPT_NAME "" / PATH_INFO $uri keep signet's absolute routes
    # intact; fastcgi_params supplies REQUEST_METHOD, REQUEST_URI,
    # HTTP_* (including the cookie) and REMOTE_ADDR.
    location ~ ^/(login|logout|session|recover|register|account)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME "";
        fastcgi_param PATH_INFO $uri;
        fastcgi_param SERVER_NAME $host;
        fastcgi_pass unix:/run/signet/fcgi.sock;
    }

    location ~ ^/(webauthn|email-pin|avatar)/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME "";
        fastcgi_param PATH_INFO $uri;
        fastcgi_param SERVER_NAME $host;
        fastcgi_pass unix:/run/signet/fcgi.sock;
    }

    location = /static/js/webauthn.js {
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME "";
        fastcgi_param PATH_INFO $uri;
        fastcgi_param SERVER_NAME $host;
        fastcgi_pass unix:/run/signet/fcgi.sock;
    }

    # --- the protected application. -------------------------------------
    location / {
        auth_request /_session;

        # signet's /session answers 200 with Remote-User / Remote-Email
        # response headers; the auth subrequest exposes them as
        # $upstream_http_*, and they become the app's identity headers.
        auth_request_set $signet_user  $upstream_http_remote_user;
        auth_request_set $signet_email $upstream_http_remote_email;
        proxy_set_header X-Forwarded-User  $signet_user;
        proxy_set_header X-Forwarded-Email $signet_email;

        # A visitor can send these too: the app must only hear signet's word.
        # Clear every header /session can set, Remote-Avatar included: signet
        # sends it only for an account with a picture, so it is not always replaced.
        proxy_set_header Remote-User   "";
        proxy_set_header Remote-Email  "";
        proxy_set_header Remote-Avatar "";

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 401 from /_session -> go sign in, come back here.
        error_page 401 = @to_login;

        proxy_pass http://127.0.0.1:8080;   # the app upstream
    }

    # auth_request works over FastCGI too: the subrequest asks signet who
    # the visitor's cookie belongs to.  REQUEST_URI is overridden to the
    # /session route; the subrequest inherits the visitor's cookie.  It also
    # inherits the visitor's method and body, and /session answers only GET,
    # so without the next three lines every POST to the app would be a 500.
    location = /_session {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME "";
        fastcgi_param PATH_INFO /session;
        fastcgi_param REQUEST_URI /session;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_pass_request_body off;
        fastcgi_pass unix:/run/signet/fcgi.sock;
    }

    location @to_login {
        return 302 "/login?referrer=$scheme://$http_host$request_uri";
    }

    # API clients validating cookies server-side can call /api/v1/validate
    # with an API key instead of auth_request — route it like the signet
    # locations above.
}
