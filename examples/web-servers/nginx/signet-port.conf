# nginx in front of signet and one protected application — TCP variant.
# signet variant: listen: ":9090"  (loopback TCP).  See signet-fcgi.conf
# for the same contract over a unix socket answering FastCGI.

upstream signet {
    server 127.0.0.1:9090;
}

server {
    listen 80;
    server_name app.example.com;

    # --- signet's own URIs, mounted on this origin. ---------------------
    location = /login   { proxy_pass http://signet; }
    location = /logout  { proxy_pass http://signet; }
    location = /session { proxy_pass http://signet; }
    location = /recover { proxy_pass http://signet; }
    location = /register { proxy_pass http://signet; }
    location = /account { proxy_pass http://signet; }
    location /webauthn/  { proxy_pass http://signet; }
    location /email-pin/ { proxy_pass http://signet; }
    location /avatar/    { proxy_pass http://signet; }
    location = /static/js/webauthn.js { proxy_pass http://signet; }

    # The Host header matters: signet uses it to decide whether a
    # ?referrer= is same-host, and allowed_redirect_hosts matches
    # against it.  Pass the original host through, with its port: $host
    # drops the port.  nginx ignores these three in any location that sets
    # a proxy_set_header of its own, so those below repeat them.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- the protected application. -------------------------------------
    location / {
        auth_request /_session;

        # signet's /session answers 200 with Remote-User / Remote-Email
        # response headers; the auth subrequest exposes them as
        # $upstream_http_*, and they become the app's identity headers.
        auth_request_set $signet_user  $upstream_http_remote_user;
        auth_request_set $signet_email $upstream_http_remote_email;
        proxy_set_header X-Forwarded-User  $signet_user;
        proxy_set_header X-Forwarded-Email $signet_email;

        # A visitor can send these too: the app must only hear signet's word.
        # Clear every header /session can set, Remote-Avatar included: signet
        # sends it only for an account with a picture, so it is not always replaced.
        proxy_set_header Remote-User   "";
        proxy_set_header Remote-Email  "";
        proxy_set_header Remote-Avatar "";

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 401 from /_session -> go sign in, come back here.
        error_page 401 = @to_login;

        proxy_pass http://127.0.0.1:8080;   # the app upstream
    }

    # Internal subrequest target: ask signet who the visitor's cookie
    # belongs to.  The body is irrelevant; the cookie is what answers.
    location = /_session {
        internal;
        proxy_pass http://signet/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @to_login {
        return 302 "/login?referrer=$scheme://$http_host$request_uri";
    }

    # API clients that validate cookies server-side can call
    # /api/v1/validate with an API key instead of auth_request; that
    # endpoint needs no special handling beyond the proxy.
}
