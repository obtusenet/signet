# OpenBSD httpd(8) in front of a signet-protected site — read this first.
#
# httpd serves static files and speaks FastCGI, but it has NO HTTP reverse
# proxy: there is no way to mount signet's /login under the app's port with
# httpd alone.  The supported no-extra-packages pattern on a vanilla OpenBSD
# box is:
#
#   - signet listens on TCP and its port is reachable from the browsers
#     (/etc/signet/config.yaml: listen: ":9090");
#   - the app (here: the scribe editor, via FastCGI) checks the visitor's
#     cookie server-side against signet's /session and sends anonymous
#     browsers to http://host:9090/login?referrer=... on its own;
#   - the signetid cookie is host-only, and host-scoped cookies IGNORE THE
#     PORT: a browser that signed in at :9090 carries the cookie to the app
#     on any other port of the same host.  Keep signet and the app on one
#     hostname.
#   - the return redirect after login crosses ports, so signet needs the
#     app's host:port in allowed_redirect_hosts, e.g.:
#         allowed_redirect_hosts:
#           - "site.example.com:8080"
#
# If you want one clean origin (no :9090 in URLs): signet can answer
# FastCGI itself — see signet-fcgi.conf in this directory, which mounts
# every signet URI through httpd.  Caddy and nginx variants ship beside
# those files.
#
# chroot note: httpd(8) runs inside /var/www.  Paths in FastCGI socket and
# root directives below are relative to that chroot: "/run/scribe.sock" is
# the real path /var/www/run/scribe.sock.

#
# TLS: terminate here in production.  Sketched for clarity; acme-client(1)
# provisions the certificates.
#
server "site.example.com" {
	listen on egress port 80
	# listen on egress tls port 443
	# tls { certificate "/etc/ssl/site.example.com_fullchain.pem" key "/etc/ssl/private/site.example.com.key" }

	# The published static site.
	root "/htdocs/site"
}

#
# The scribe editor, answered over FastCGI (scribe serve "speaks FastCGI
# when told": point its listen at a unix socket path inside httpd's chroot,
# e.g. listen: "/var/www/run/scribe.sock", and make sure the www group can
# write it).  scribe does the signet check itself via auth.validate_url in
# /etc/scribe.yaml — no proxy auth needed, which is exactly what this
# httpd-only stack requires.
#
server "site.example.com" {
	listen on egress port 8080

	location "/scribe/*" {
		root "/scribe-fcgi"
		fastcgi {
			# chroot-relative: real path /var/www/run/scribe.sock
			socket "/run/scribe.sock"
			# httpd hands the full REQUEST_URI to the handler; the
			# editor strips its own prefix via base_path in its
			# config.  strip here only trims DOCUMENT_ROOT /
			# SCRIPT_FILENAME path components.
		}
	}
}

#
# signet itself is not proxied here — it runs as its own service
# (rcctl start signet) and serves its login, logout, session and WebAuthn
# endpoints directly on http://site.example.com:9090.
#
# The signet process needs to read its socket and files as the _signet
# user; see signet(1) and signet-config.yaml(5).  For the same-origin
# alternative (signet answering FastCGI through httpd itself) and the
# equivalent setups on other servers:
#
#   httpd:  signet-fcgi.conf (in this directory)
#   caddy:  ../caddy/Caddyfile-port, ../caddy/Caddyfile-socket
#   nginx:  ../nginx/signet-port.conf, ../nginx/signet-fcgi.conf
