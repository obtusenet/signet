# OpenBSD httpd(8) in front of a signet-protected site — FastCGI variant.
#
# signet variant: protocol: "fastcgi", listen: "/var/www/run/signet/fcgi.sock"
#
# This is the setup httpd has always wanted: httpd(8) has NO HTTP reverse
# proxy, but it speaks FastCGI — so signet answers over the protocol and
# every auth URI (login, logout, session, WebAuthn, email-PIN) lives on
# the SAME origin as the site.  One port, one cookie scope, no redirect
# dance between ports.
#
# Filesystem notes (httpd chroots to /var/www):
#   - the socket path below is chroot-relative: "/run/signet/fcgi.sock"
#     is really /var/www/run/signet/fcgi.sock on the host;
#   - signet (running as _signet) binds it; httpd (as www) must be able
#     to connect: a setgid-www directory is the tidy answer —
#       install -d -o _signet -g www -m 2770 /var/www/run/signet
#     with socket_mode "0660" (default) that gives www group-write;
#     or bluntly socket_mode "0666" and let the path be the boundary.
#   - signet needs no TLS: httpd terminates it and sends HTTPS=on, which
#     Go's cgi layer turns into a secure request — keep cookie_secure.

server "site.example.com" {
	listen on egress port 80
	# listen on egress tls port 443
	# tls { certificate "/etc/ssl/site.example.com_fullchain.pem" key "/etc/ssl/private/site.example.com.key" }

	# The published static site (public by nature), for every path the
	# locations below do not take.  It belongs here: location "/" would
	# match only the home page, and leave every other page a 404.
	root "/htdocs/site"

	# --- signet, answering FastCGI on the same origin. -----------------
	location "/login" {
		fastcgi { socket "/run/signet/fcgi.sock" }
	}
	location "/logout" {
		fastcgi { socket "/run/signet/fcgi.sock" }
	}
	location "/session" {
		fastcgi { socket "/run/signet/fcgi.sock" }
	}
	location "/recover" {
		fastcgi { socket "/run/signet/fcgi.sock" }
	}
	location "/register" {
		fastcgi { socket "/run/signet/fcgi.sock" }
	}
	location "/account" {
		fastcgi { socket "/run/signet/fcgi.sock" }
	}
	location "/webauthn/*" {
		fastcgi { socket "/run/signet/fcgi.sock" }
	}
	location "/email-pin/*" {
		fastcgi { socket "/run/signet/fcgi.sock" }
	}
	location "/avatar/*" {
		fastcgi { socket "/run/signet/fcgi.sock" }
	}
	location "/static/js/webauthn.js" {
		fastcgi { socket "/run/signet/fcgi.sock" }
	}
}

# Dynamic applications cannot be reverse-proxied by httpd; mount them as
# FastCGI responders of their own (as scribe's editor does), or run a
# proxy-capable server (caddy, nginx) in front — see the sibling
# directories.  Applications that share this host get the signetid cookie
# automatically: host-scoped cookies ignore ports, and httpd can hand
# them the /session endpoint for their own server-side validation.
